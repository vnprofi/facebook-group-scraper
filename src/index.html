<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FBSoft</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #eef1f4;
      --surface: #ffffff;
      --surface-2: #f7f8fa;
      --border: #dde1e6;
      --text: #111827;
      --muted: #5b6472;
      --primary: #2456d6;
      --primary-hover: #1c46b4;
      --danger: #b42318;
      --ok: #127a4b;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      font-size: 13px;
      line-height: 1.45;
      color: var(--text);
      background: var(--bg);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    button {
      font: inherit;
    }

    svg {
      display: block;
    }

    /* Шапка -------------------------------------------------------------- */

    .topbar {
      flex: 0 0 56px;
      height: 56px;
      display: flex;
      align-items: center;
      gap: 24px;
      padding: 0 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      user-select: none;
    }

    .brand-mark {
      width: 26px;
      height: 26px;
      border-radius: 6px;
      background: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
    }

    .brand-name {
      font-size: 14px;
      font-weight: 650;
      letter-spacing: -0.01em;
    }

    .tabs {
      display: flex;
      align-self: stretch;
      gap: 4px;
    }

    .tab {
      border: 0;
      background: none;
      color: var(--muted);
      font-size: 13px;
      font-weight: 500;
      padding: 0 12px;
      border-bottom: 2px solid transparent;
      cursor: pointer;
    }

    .tab:hover {
      color: var(--text);
    }

    .tab.active {
      color: var(--text);
      border-bottom-color: var(--primary);
      font-weight: 600;
    }

    .topbar-actions {
      margin-left: auto;
      display: flex;
      gap: 4px;
    }

    /* Кнопки ------------------------------------------------------------- */

    .btn {
      height: 34px;
      padding: 0 12px;
      border-radius: 6px;
      border: 1px solid transparent;
      background: none;
      color: var(--text);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--primary);
      color: #ffffff;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--primary-hover);
    }

    .btn-outline {
      background: #ffffff;
      border-color: var(--border);
      color: var(--text);
    }

    .btn-outline:hover:not(:disabled) {
      background: #f4f6f8;
    }

    .btn-ghost {
      background: transparent;
      color: var(--muted);
    }

    .btn-ghost:hover:not(:disabled) {
      background: #f2f4f7;
      color: var(--text);
    }

    .btn-danger {
      background: #ffffff;
      border-color: #f0c2bd;
      color: var(--danger);
    }

    .btn-danger:hover:not(:disabled) {
      background: #fdf3f2;
    }

    .btn-sm {
      height: 26px;
      padding: 0 10px;
      font-size: 12px;
    }

    /* Панель управления -------------------------------------------------- */

    .toolbar {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      padding: 10px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    .input {
      flex: 1 1 320px;
      min-width: 240px;
      height: 34px;
      padding: 0 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #ffffff;
      color: var(--text);
      font: inherit;
      outline: none;
    }

    .input::placeholder {
      color: #98a2b3;
    }

    .input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(36, 86, 214, 0.12);
    }

    .divider {
      width: 1px;
      height: 22px;
      background: var(--border);
      margin: 0 4px;
    }

    /* Строка статуса ----------------------------------------------------- */

    .statusbar {
      flex: 0 0 34px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 16px;
      background: var(--surface-2);
      border-bottom: 1px solid var(--border);
      font-size: 12px;
      color: var(--muted);
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #98a2b3;
      flex: 0 0 auto;
    }

    .dot.ok { background: var(--ok); }
    .dot.active { background: var(--primary); }
    .dot.error { background: var(--danger); }

    .status-text {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .spacer {
      flex: 1;
    }

    .counter {
      white-space: nowrap;
    }

    .counter b {
      color: var(--text);
      font-weight: 650;
      font-variant-numeric: tabular-nums;
    }

    /* Рабочая область ---------------------------------------------------- */

    .workspace {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      padding: 12px;
    }

    .browser {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 1px 2px rgba(16, 24, 40, 0.04);
    }

    .browser-bar {
      flex: 0 0 36px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 8px 0 10px;
      background: var(--surface-2);
      border-bottom: 1px solid var(--border);
    }

    .browser-address {
      flex: 1;
      height: 24px;
      line-height: 24px;
      padding: 0 8px;
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 5px;
      font-size: 12px;
      color: var(--muted);
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    #browser {
      flex: 1 1 auto;
      width: 100%;
      min-height: 0;
      border: 0;
      display: flex;
      background: #ffffff;
    }

    /* Подвал ------------------------------------------------------------- */

    .footer {
      flex: 0 0 56px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 16px;
      background: var(--surface);
      border-top: 1px solid var(--border);
    }

    .footer-hint {
      font-size: 12px;
      color: #98a2b3;
    }

    /* macOS -------------------------------------------------------------- */

    body.platform-darwin .topbar {
      -webkit-app-region: drag;
      padding-left: 84px;
    }

    body.platform-darwin .topbar button {
      -webkit-app-region: no-drag;
    }

    @media (max-width: 980px) {
      .brand-name { display: none; }
      .footer-hint { display: none; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
          <path d="M2 3.5h10M2 7h10M2 10.5h6" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </span>
      <span class="brand-name">FBSoft</span>
    </div>

    <nav class="tabs" role="tablist">
      <button class="tab active" data-kind="members" role="tab" aria-selected="true">Участники группы</button>
      <button class="tab" data-kind="posts" role="tab" aria-selected="false">Посты профиля</button>
    </nav>

    <div class="topbar-actions">
      <button class="btn btn-ghost" id="contactBtn" type="button">Связаться</button>
      <button class="btn btn-ghost" id="logoutBtn" type="button">Выйти</button>
    </div>
  </header>

  <section class="toolbar">
    <input
      class="input"
      id="urlInput"
      type="text"
      spellcheck="false"
      autocomplete="off"
      placeholder="Ссылка на группу или профиль Facebook"
    >
    <button class="btn btn-primary" id="openBtn" type="button">Открыть</button>
    <span class="divider" aria-hidden="true"></span>
    <button class="btn btn-outline" id="autoBtn" type="button">Автоскролл</button>
    <button class="btn btn-outline" id="manualBtn" type="button">Ручной скролл</button>
    <button class="btn btn-danger" id="stopBtn" type="button" disabled>Остановить</button>
  </section>

  <section class="statusbar">
    <span class="dot" id="statusDot" aria-hidden="true"></span>
    <span class="status-text" id="statusText">Загрузка Facebook…</span>
    <span class="spacer"></span>
    <span class="counter">Собрано: <b id="count">0</b></span>
  </section>

  <main class="workspace">
    <div class="browser">
      <div class="browser-bar">
        <span class="browser-address" id="address">facebook.com</span>
        <button class="btn btn-ghost btn-sm" id="reloadBtn" type="button">Обновить</button>
      </div>
      <webview id="browser" partition="persist:fb" src="https://www.facebook.com"></webview>
    </div>
  </main>

  <footer class="footer">
    <button class="btn btn-ghost" id="resetBtn" type="button">Сбросить данные</button>
    <span class="spacer"></span>
    <span class="footer-hint" id="footerHint">CSV и Excel содержат текущую выборку</span>
    <button class="btn btn-outline" id="csvBtn" type="button" disabled>Экспорт CSV</button>
    <button class="btn btn-primary" id="excelBtn" type="button" disabled>Экспорт Excel</button>
  </footer>

  <script>
    const webview = document.getElementById('browser');

    const els = {
      urlInput: document.getElementById('urlInput'),
      openBtn: document.getElementById('openBtn'),
      autoBtn: document.getElementById('autoBtn'),
      manualBtn: document.getElementById('manualBtn'),
      stopBtn: document.getElementById('stopBtn'),
      resetBtn: document.getElementById('resetBtn'),
      csvBtn: document.getElementById('csvBtn'),
      excelBtn: document.getElementById('excelBtn'),
      contactBtn: document.getElementById('contactBtn'),
      logoutBtn: document.getElementById('logoutBtn'),
      reloadBtn: document.getElementById('reloadBtn'),
      address: document.getElementById('address'),
      statusText: document.getElementById('statusText'),
      statusDot: document.getElementById('statusDot'),
      count: document.getElementById('count')
    };

    const state = {
      kind: 'members',
      counts: { members: 0, posts: 0 },
      ready: false,
      session: false,
      scrolling: false
    };

    const RESERVED_PATHS = [
      'groups', 'watch', 'marketplace', 'friends', 'messages', 'notifications',
      'feed', 'photo', 'photo.php', 'story.php', 'reel', 'reels', 'share', 'login',
      'help', 'settings', 'bookmarks', 'events', 'pages', 'gaming', 'memories',
      'saved', 'ads', 'business', 'search', 'hashtag', 'p', 'video.php',
      'permalink.php', 'media', 'stories', 'stories.php', 'composer', 'notes',
      'livemap', 'policies', 'privacy', 'terms', 'about', 'careers', 'developers',
      'payments', 'fundraisers', 'weather', 'fundraiser', 'create'
    ];

    function isGroupUrl(url) {
      return typeof url === 'string' && /facebook\.com\/groups\//i.test(url);
    }

    function isProfileUrl(url) {
      try {
        const parsed = new URL(url);
        if (!/(^|\.)facebook\.com$/i.test(parsed.hostname)) return false;
        if (parsed.pathname.indexOf('/profile.php') === 0) return true;
        if (parsed.pathname.indexOf('/people/') === 0) return true;

        const parts = parsed.pathname.split('/').filter(Boolean);
        if (!parts.length) return false;
        return RESERVED_PATHS.indexOf(parts[0]) === -1;
      } catch (error) {
        return false;
      }
    }

    function setStatus(text, tone) {
      els.statusText.textContent = text;
      els.statusDot.className = 'dot' + (tone ? ' ' + tone : '');
    }

    function setCounts(members, posts) {
      state.counts.members = Math.max(0, members || 0);
      state.counts.posts = Math.max(0, posts || 0);

      const active = state.counts[state.kind];
      els.count.textContent = String(active);
      els.csvBtn.disabled = active <= 0;
      els.excelBtn.disabled = active <= 0;
    }

    function updateAddress(url) {
      const value = url || 'facebook.com';
      els.address.textContent = value;
      els.address.title = value;
    }

    function navigationHint(url) {
      if (!url || !/facebook\.com/i.test(url)) {
        return { text: 'Ожидание Facebook…', tone: 'idle' };
      }
      if (/\/(login|checkpoint|recover)/i.test(url)) {
        return { text: 'Войдите в аккаунт Facebook, чтобы продолжить', tone: 'idle' };
      }
      if (isGroupUrl(url)) {
        if (state.kind === 'posts') {
          return { text: 'Для сбора постов откройте страницу профиля', tone: 'idle' };
        }
        return url.indexOf('/members') !== -1
          ? { text: 'Страница участников. Запустите сбор.', tone: 'ok' }
          : { text: 'Откройте вкладку «Участники» в группе', tone: 'idle' };
      }
      if (isProfileUrl(url)) {
        if (state.kind === 'members') {
          return { text: 'Для сбора участников откройте страницу группы', tone: 'idle' };
        }
        return { text: 'Страница профиля. Запустите сбор постов.', tone: 'ok' };
      }
      return {
        text: state.kind === 'members'
          ? 'Откройте страницу группы Facebook'
          : 'Откройте страницу профиля Facebook',
        tone: 'idle'
      };
    }

    function applyHint() {
      const hint = navigationHint(webview.getURL());
      setStatus(hint.text, hint.tone);
    }

    function setKind(kind) {
      state.kind = kind === 'posts' ? 'posts' : 'members';

      // Переключение вкладки не должно продолжать сбор в прежнем режиме.
      if (state.session) {
        state.session = false;
        state.scrolling = false;
        els.stopBtn.disabled = true;
        try {
          webview.executeJavaScript('window.__fbsoftStop && window.__fbsoftStop()').catch(() => {});
        } catch (error) { /* webview ещё не готов */ }
      }

      document.querySelectorAll('.tab').forEach((tab) => {
        const active = tab.dataset.kind === state.kind;
        tab.classList.toggle('active', active);
        tab.setAttribute('aria-selected', active ? 'true' : 'false');
      });

      setCounts(state.counts.members, state.counts.posts);

      if (state.ready) {
        applyHint();
      }
    }

    function normalizeUrl(raw) {
      let value = String(raw || '').trim();
      if (!value) return null;
      if (!/^https?:\/\//i.test(value)) value = 'https://' + value;

      let parsed;
      try {
        parsed = new URL(value);
      } catch (error) {
        return null;
      }

      if (!/(^|\.)facebook\.com$/i.test(parsed.hostname)) return null;

      parsed.hash = '';
      const parts = parsed.pathname.split('/').filter(Boolean);
      if (parts[0] === 'groups' && parts.length === 2) {
        parsed.pathname = '/groups/' + parts[1] + '/members';
      }
      return parsed.toString();
    }

    function openTarget() {
      const target = normalizeUrl(els.urlInput.value);
      if (!target) {
        setStatus('Вставьте корректную ссылку на facebook.com', 'error');
        return;
      }

      state.ready = false;
      state.session = false;
      setStatus('Загрузка страницы…', 'idle');

      try {
        webview.loadURL(target);
      } catch (error) {
        setStatus('Не удалось открыть страницу: ' + error.message, 'error');
      }
    }

    async function start(kind, mode) {
      if (!state.ready) {
        setStatus('Facebook ещё не загружен', 'error');
        return;
      }

      const url = webview.getURL();

      if (kind === 'posts') {
        if (!isProfileUrl(url)) {
          setStatus('Сбор постов доступен только на странице профиля', 'error');
          return;
        }
      } else if (!isGroupUrl(url)) {
        setStatus('Сбор участников доступен только на странице группы', 'error');
        return;
      }

      try {
        const script = await window.api.getScript(kind, mode);
        await webview.executeJavaScript(script);

        state.session = true;
        state.scrolling = mode === 'auto';
        els.stopBtn.disabled = mode !== 'auto';

        setStatus(
          mode === 'auto'
            ? 'Сбор запущен, страница прокручивается автоматически'
            : 'Сбор запущен. Прокручивайте страницу вручную',
          'active'
        );
      } catch (error) {
        setStatus('Не удалось запустить сбор: ' + error.message, 'error');
      }
    }

    async function stop() {
      try {
        await webview.executeJavaScript('window.__fbsoftStop && window.__fbsoftStop()');
        state.scrolling = false;
        els.stopBtn.disabled = true;
        setStatus('Сбор остановлен', 'idle');
      } catch (error) {
        setStatus('Не удалось остановить сбор: ' + error.message, 'error');
      }
    }

    async function resetData() {
      if (!window.confirm('Удалить собранные данные для текущей вкладки?')) return;

      try {
        await webview.executeJavaScript(
          "window.__fbsoftReset && window.__fbsoftReset('" + state.kind + "')"
        );
        state.scrolling = false;
        els.stopBtn.disabled = true;
        if (state.kind === 'posts') setCounts(state.counts.members, 0);
        else setCounts(0, state.counts.posts);
        setStatus('Данные сброшены', 'idle');
      } catch (error) {
        setStatus('Не удалось сбросить данные: ' + error.message, 'error');
      }
    }

    async function readRows() {
      const variable = state.kind === 'posts' ? '__fbPosts' : '__fbMembers';
      const raw = await webview.executeJavaScript('JSON.stringify(window.' + variable + ' || [])');
      try {
        const rows = JSON.parse(raw);
        return Array.isArray(rows) ? rows : [];
      } catch (error) {
        return [];
      }
    }

    function toCsv(rows) {
      return rows.map((row) => row.map((cell) => {
        const value = cell == null ? '' : String(cell);
        return /[;"\r\n]/.test(value) ? '"' + value.replace(/"/g, '""') + '"' : value;
      }).join(';')).join('\r\n');
    }

    async function exportData(format) {
      try {
        const rows = await readRows();
        if (rows.length <= 1) {
          setStatus('Нет данных для экспорта', 'error');
          return;
        }

        setStatus('Сохранение файла…', 'idle');
        const result = format === 'csv'
          ? await window.api.saveCsv(toCsv(rows), state.kind)
          : await window.api.saveExcel(rows, state.kind);

        if (result && result.success) {
          setStatus('Файл сохранён: ' + result.path, 'ok');
        } else if (result && result.cancelled) {
          setStatus('Сохранение отменено', 'idle');
        } else {
          setStatus('Ошибка сохранения: ' + ((result && result.error) || 'неизвестная ошибка'), 'error');
        }
      } catch (error) {
        setStatus('Ошибка экспорта: ' + error.message, 'error');
      }
    }

    async function reloadPage() {
      try {
        webview.reload();
      } catch (error) {
        setStatus('Не удалось обновить страницу', 'error');
      }
    }

    async function logout() {
      if (!window.confirm('Выйти из аккаунта Facebook? Сессия будет очищена.')) return;

      try {
        const result = await window.api.logout();
        if (!result.success) throw new Error(result.error || 'неизвестная ошибка');

        state.session = false;
        state.scrolling = false;
        els.stopBtn.disabled = true;
        setCounts(0, 0);
        setStatus('Сессия очищена, выполняется перезагрузка…', 'idle');
        webview.reload();
      } catch (error) {
        setStatus('Ошибка выхода: ' + error.message, 'error');
      }
    }

    function openContact() {
      window.api.openExternal('https://t.me/SeoName1');
    }

    async function poll() {
      if (!state.ready) return;

      try {
        const snapshot = await webview.executeJavaScript(`({
          members: (window.__fbMembers || []).length,
          posts: (window.__fbPosts || []).length,
          scrolling: !!(window.__fbsoftStatus && window.__fbsoftStatus().scrolling)
        })`);

        if (!snapshot) return;
        setCounts(Math.max(0, snapshot.members - 1), Math.max(0, snapshot.posts - 1));

        if (snapshot.scrolling !== state.scrolling) {
          state.scrolling = snapshot.scrolling;
          els.stopBtn.disabled = !snapshot.scrolling;
          if (!snapshot.scrolling && state.session) {
            setStatus('Сбор завершён. Данные можно экспортировать.', 'ok');
          }
        }
      } catch (error) {
        /* страница ещё перезагружается */
      }
    }

    function setupWebview() {
      webview.addEventListener('dom-ready', () => {
        state.ready = true;
        updateAddress(webview.getURL());

        // После полной перезагрузки возвращаем перехватчик, если сбор уже запускали.
        if (state.session) {
          const url = webview.getURL();
          if (isGroupUrl(url) || isProfileUrl(url)) {
            window.api.getScript(state.kind, 'manual')
              .then((script) => webview.executeJavaScript(script))
              .catch(() => {});
          }
        }
      });

      webview.addEventListener('did-navigate', (event) => {
        updateAddress(event.url);
        setCounts(0, 0);
        state.scrolling = false;
        els.stopBtn.disabled = true;

        const hint = navigationHint(event.url);
        setStatus(hint.text, hint.tone);
      });

      webview.addEventListener('did-navigate-in-page', (event) => {
        updateAddress(event.url);
        if (!state.session) {
          const hint = navigationHint(event.url);
          setStatus(hint.text, hint.tone);
        }
      });

      webview.addEventListener('did-fail-load', (event) => {
        if (event.errorCode === -3) return; // ERR_ABORTED — обычная навигация
        state.ready = false;
        setStatus('Не удалось загрузить страницу: ' + (event.errorDescription || 'ошибка сети'), 'error');
      });
    }

    function bindControls() {
      document.querySelectorAll('.tab').forEach((tab) => {
        tab.addEventListener('click', () => setKind(tab.dataset.kind));
      });

      els.openBtn.addEventListener('click', openTarget);
      els.urlInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') openTarget();
      });

      els.autoBtn.addEventListener('click', () => start(state.kind, 'auto'));
      els.manualBtn.addEventListener('click', () => start(state.kind, 'manual'));
      els.stopBtn.addEventListener('click', stop);
      els.resetBtn.addEventListener('click', resetData);
      els.csvBtn.addEventListener('click', () => exportData('csv'));
      els.excelBtn.addEventListener('click', () => exportData('excel'));
      els.contactBtn.addEventListener('click', openContact);
      els.logoutBtn.addEventListener('click', logout);
      els.reloadBtn.addEventListener('click', reloadPage);
    }

    document.addEventListener('DOMContentLoaded', () => {
      if (window.api && window.api.platform === 'darwin') {
        document.body.classList.add('platform-darwin');
      }

      bindControls();
      setupWebview();
      setKind('members');
      setStatus('Загрузка Facebook…', 'idle');
      setInterval(poll, 1000);
    });
  </script>
</body>
</html>
